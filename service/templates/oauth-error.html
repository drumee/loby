<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-in interrupted</title>
  <!-- lodash's interpolate delimiter is RAW, so the URL is serialised as a
       JSON string literal rather than dropped into a quoted one: an apostrophe
       in the value stays inside the string instead of ending it. -->
  <script>location.replace(<%= JSON.stringify(redirect) %>);</script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #f2f2f7;
      font-family: 'Geist','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
      color: #65656c;
    }
  </style>
</head>
<body>
  <p>Sign-in didn&rsquo;t complete &mdash; taking you back&hellip;</p>
</body>
</html>
