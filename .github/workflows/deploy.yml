name: CD - deploy loby

on:
  push:
    branches: [preview, test]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target environment"
        type: choice
        options: [TEST, UAT, PROD]
        default: TEST

concurrency:
  group: cd-loby-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      SGP_USER: debian
      SGP_HOST: sgp
      CONTAINER: drumee
      PLUGIN: loby
      LOG_FILE: /tmp/cd-loby-${{ github.run_id }}.log
    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          elif [ "${{ github.ref_name }}" = "preview" ]; then
            TARGET="UAT"
          else
            TARGET="TEST"
          fi
          case "$TARGET" in
            TEST) EP=test;    PORT=24002; BRANCH=test;    SRC=/usr/src/drumee.test/$PLUGIN; MODE=git ;;
            UAT)  EP=preview; PORT=24001; BRANCH=preview; SRC=/usr/src/drumee/$PLUGIN;      MODE=git ;;
            PROD) EP=main;    PORT=24000; BRANCH=main; SRC=/usr/src/drumee/$PLUGIN;      MODE=runtime ;;
            *) echo "Unknown target: $TARGET"; exit 1 ;;
          esac
          # loc=stage -> deploy locally on the runner host (drumee.in) `main` endpoint
          # loc=container -> deploy into the prod box (sgp) docker container
          LOC=container; [ "$TARGET" = "TEST" ] && LOC=stage
          {
            echo "target=$TARGET"
            echo "endpoint=$EP"
            echo "port=$PORT"
            echo "branch=$BRANCH"
            echo "src=$SRC"
            echo "mode=$MODE"
            echo "loc=$LOC"
            echo "runtime=/srv/drumee/runtime/plugins/server/$EP/$PLUGIN"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Target $TARGET -> endpoint $EP (plugin $PLUGIN, branch $BRANCH, loc $LOC)"

      # ---------------- TEST: deploy plugin to drumee.in (stage) `main` endpoint ----------------
      - name: Deploy to stage main (TEST)
        id: stage
        if: steps.target.outputs.loc == 'stage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DIR: /usr/src/drumee/loby
        run: |
          set -euo pipefail
          AUTH="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          [ -d "$REPO_DIR/.git" ] || sudo git init -q "$REPO_DIR"
          PREV=$(sudo git -C "$REPO_DIR" rev-parse HEAD 2>/dev/null || echo "")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          sudo git -C "$REPO_DIR" fetch --depth 1 "$AUTH" test
          sudo git -C "$REPO_DIR" checkout -f -B test FETCH_HEAD
          sudo git -C "$REPO_DIR" reset --hard FETCH_HEAD
          sudo git -C "$REPO_DIR" clean -fd -e .dev-tools.rc || true
          # Change summary for the Telegram notification (best effort — PREV may
          # be missing from the shallow history on a fresh runner).
          NEW=$(sudo git -C "$REPO_DIR" rev-parse HEAD)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          CHANGES=""; IMPACT=""
          if [ -n "$PREV" ] && sudo git -C "$REPO_DIR" cat-file -e "$PREV" 2>/dev/null; then
            FILES=$(sudo git -C "$REPO_DIR" diff --name-only "$PREV" "$NEW" | wc -l | tr -d ' ')
            COMMITS=$(sudo git -C "$REPO_DIR" rev-list --count "$PREV..$NEW" 2>/dev/null || echo "")
            if [ -n "$COMMITS" ]; then CHANGES="$COMMITS commits · $FILES files"; else CHANGES="$FILES files"; fi
            IMPACT=$(sudo git -C "$REPO_DIR" diff --name-only "$PREV" "$NEW" \
              | awk -F/ '{ if (NF>1) print $1"/"$2; else print $1 }' \
              | sort | uniq -c | sort -rn | head -4 | awk '{print $2}' | paste -sd ', ' -)
          fi
          echo "changes=$CHANGES" >> "$GITHUB_OUTPUT"
          echo "impact=$IMPACT"   >> "$GITHUB_OUTPUT"
          echo "Deploying $(sudo git -C "$REPO_DIR" rev-parse --short HEAD) plugin to stage main"
          sudo bash -c "cd '$REPO_DIR' && npm install --no-audit --no-fund"
          sudo bash -c "cd '$REPO_DIR' && npm run deploy -- deploy"
          sudo /usr/sbin/drumee restart main/service

      - name: Verify stage main (TEST)
        if: steps.target.outputs.loc == 'stage'
        run: |
          set -euo pipefail
          sleep 6
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: drumee.in' https://localhost/-/ || echo 000)
          echo "stage main HTTP: $CODE"
          [[ "$CODE" =~ ^[2-4][0-9][0-9]$ ]] || { echo "::error::stage main verify failed ($CODE)"; exit 1; }
          echo "Verified stage main (loby plugin loaded)"

      - name: Rollback stage (on failure)
        id: rollback_stage
        if: failure() && steps.target.outputs.loc == 'stage' && steps.stage.outputs.prev != ''
        env:
          REPO_DIR: /usr/src/drumee/loby
          PREV: ${{ steps.stage.outputs.prev }}
        run: |
          set -uo pipefail
          echo "::warning::Rolling back stage loby to ${PREV:0:8}"
          sudo git -C "$REPO_DIR" reset --hard "$PREV"
          sudo bash -c "cd '$REPO_DIR' && npm run deploy -- deploy" || true
          sudo /usr/sbin/drumee restart main/service || true

      - name: Fetch and reset working tree
        id: fetch
        if: steps.target.outputs.loc == 'container'
        env:
          SRC: ${{ steps.target.outputs.src }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          OUTPUT=$(ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $SRC
          PREV=\$(git rev-parse HEAD)
          echo "PREV=\$PREV"
          git fetch origin $BRANCH --quiet
          git checkout -f -B $BRANCH origin/$BRANCH --quiet
          git clean -fd --quiet >/dev/null 2>&1 || true
          NEW=\$(git rev-parse HEAD)
          echo "NEW=\$NEW"
          CHANGES=""; IMPACT=""
          if git cat-file -e "\$PREV" 2>/dev/null; then
            FILES=\$(git diff --name-only "\$PREV" "\$NEW" | wc -l | tr -d ' ')
            COMMITS=\$(git rev-list --count "\$PREV..\$NEW" 2>/dev/null || echo "")
            if [ -n "\$COMMITS" ]; then CHANGES="\$COMMITS commits · \$FILES files"; else CHANGES="\$FILES files"; fi
            IMPACT=\$(git diff --name-only "\$PREV" "\$NEW" \
              | awk -F/ '{ if (NF>1) print \$1"/"\$2; else print \$1 }' \
              | sort | uniq -c | sort -rn | head -4 | awk '{print \$2}' | paste -sd ', ' -)
          fi
          echo "CHANGES=\$CHANGES"
          echo "IMPACT=\$IMPACT"
          EOSSH
          )
          echo "$OUTPUT"
          PREV=$(echo "$OUTPUT" | grep '^PREV=' | cut -d= -f2)
          NEW=$(echo "$OUTPUT"  | grep '^NEW='  | cut -d= -f2)
          CHANGES=$(echo "$OUTPUT" | grep '^CHANGES=' | cut -d= -f2- || true)
          IMPACT=$(echo "$OUTPUT"  | grep '^IMPACT='  | cut -d= -f2- || true)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"   >> "$GITHUB_OUTPUT"
          echo "changes=$CHANGES" >> "$GITHUB_OUTPUT"
          echo "impact=$IMPACT"   >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:0:8}  New: ${NEW:0:8}"

      - name: Install dependencies
        if: steps.target.outputs.loc == 'container'
        env:
          SRC: ${{ steps.target.outputs.src }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $SRC
          if ! npm install --no-audit --no-fund > $LOG_FILE 2>&1; then
            echo "::error::npm install failed. Tail:"; tail -50 $LOG_FILE; exit 1
          fi
          echo "Dependencies installed"
          EOSSH

      - name: Sync to runtime (PROD only)
        if: steps.target.outputs.mode == 'runtime'
        env:
          SRC: ${{ steps.target.outputs.src }}
          RUNTIME: ${{ steps.target.outputs.runtime }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          mkdir -p \$(dirname "$RUNTIME")
          if [ -d "$RUNTIME" ]; then rsync -a --delete "$RUNTIME/" "$RUNTIME.backup/"; fi
          rsync -a --delete --exclude=.git --exclude=.github "$SRC/" "$RUNTIME/"
          echo "Synced $SRC -> $RUNTIME"
          EOSSH

      - name: Restart endpoint service
        if: steps.target.outputs.loc == 'container'
        env:
          EP: ${{ steps.target.outputs.endpoint }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          /usr/sbin/drumee restart $EP/service >> $LOG_FILE 2>&1
          echo "Restarted $EP/service"
          sleep 3
          EOSSH

      - name: Verify HTTP
        if: steps.target.outputs.loc == 'container'
        env:
          PORT: ${{ steps.target.outputs.port }}
          EP: ${{ steps.target.outputs.endpoint }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          sleep 3
          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost:$PORT/" || echo 000)
          echo "HTTP code: \$HTTP_CODE"
          if [[ ! "\$HTTP_CODE" =~ ^[2-4][0-9][0-9]\$ ]]; then
            echo "::error::Verify failed for $EP (port $PORT): \$HTTP_CODE"; exit 1
          fi
          echo "Verified $EP on port $PORT"
          EOSSH

      - name: Rollback (on failure)
        id: rollback_container
        if: failure() && steps.target.outputs.loc == 'container' && steps.fetch.outputs.prev != ''
        env:
          SRC: ${{ steps.target.outputs.src }}
          EP: ${{ steps.target.outputs.endpoint }}
          MODE: ${{ steps.target.outputs.mode }}
          RUNTIME: ${{ steps.target.outputs.runtime }}
          PREV: ${{ steps.fetch.outputs.prev }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -uo pipefail
          cd $SRC
          echo "::warning::Rolling back to ${PREV:0:8}"
          git reset --hard $PREV --quiet
          if [ "$MODE" = "runtime" ] && [ -d "$RUNTIME.backup" ]; then
            rsync -a --delete "$RUNTIME.backup/" "$RUNTIME/"
          fi
          /usr/sbin/drumee restart $EP/service >> $LOG_FILE 2>&1 || true
          echo "Rolled back"
          EOSSH

      - name: Cleanup
        if: always() && steps.target.outputs.loc == 'container'
        continue-on-error: true
        env:
          MODE: ${{ steps.target.outputs.mode }}
          RUNTIME: ${{ steps.target.outputs.runtime }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH || true
          [ "$MODE" = "runtime" ] && rm -rf "$RUNTIME.backup" || true
          EOSSH

      # ---------------- Telegram notification (all targets) ----------------
      # Skips silently when TELEGRAM_BOT_TOKEN is not set; a Telegram outage
      # never fails the deploy.
      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          ROLLED_BACK: ${{ steps.rollback_stage.outcome == 'success' || steps.rollback_container.outcome == 'success' }}
          TARGET: ${{ steps.target.outputs.target }}
          BRANCH: ${{ steps.target.outputs.branch }}
          NEW_SHA: ${{ steps.stage.outputs.new || steps.fetch.outputs.new || github.sha }}
          CHANGES: ${{ steps.stage.outputs.changes || steps.fetch.outputs.changes }}
          IMPACT: ${{ steps.stage.outputs.impact || steps.fetch.outputs.impact }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          [ -n "$TG_TOKEN" ] || { echo "no TELEGRAM_BOT_TOKEN secret, skip"; exit 0; }
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          case "$JOB_STATUS" in
            success)   H="✅ DEPLOY $REPO → $TARGET — SUCCESS" ;;
            cancelled) H="⏹ DEPLOY $REPO → $TARGET — CANCELLED" ;;
            *) if [ "$ROLLED_BACK" = "true" ]; then
                 H="🔴 DEPLOY $REPO → $TARGET — FAILED (rolled back)"
               else
                 H="🔴 DEPLOY $REPO → $TARGET — FAILED"
               fi ;;
          esac
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1 | esc)
          if [ -z "$SUBJECT" ]; then SUBJECT="manual dispatch"; fi
          MSG=$(printf '%s\n' "$H" "Branch: $BRANCH · ${NEW_SHA:0:8}" "$SUBJECT")
          if [ -n "$CHANGES" ]; then MSG="$MSG"$'\n'"Changes: $CHANGES"; fi
          if [ -n "$IMPACT" ];  then MSG="$MSG"$'\n'"Impact: $(printf '%s' "$IMPACT" | esc)"; fi
          MSG="$MSG"$'\n'"by $ACTOR · <a href=\"$RUN_URL\">Run #$RUN_NUM</a>"
          curl -sf --max-time 10 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" -d parse_mode=HTML -d disable_web_page_preview=true \
            --data-urlencode text="$MSG" \
            && echo "telegram notification sent" \
            || echo "telegram send failed (non-blocking)"
